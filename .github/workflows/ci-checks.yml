name: CI Checks

# Static gates that run in minutes instead of after a 40-minute kernel build.
# Nothing here compiles a kernel; it verifies that the inputs a build consumes
# are still valid.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate build profiles
        run: python3 scripts/validate-configs.py

      - name: Matrix generation smoke test
        run: |
          set -euo pipefail
          # Mirrors the matrix build in build-kernel-release.yml.
          echo "[" > /tmp/matrix.json
          mapfile -t files < <(find configs/ -mindepth 2 -name "*.json" -print0 | xargs -0 -n1)
          for i in "${!files[@]}"; do
            jq -r '.' "${files[$i]}" >> /tmp/matrix.json
            if [ $((i+1)) -lt ${#files[@]} ]; then echo "," >> /tmp/matrix.json; fi
          done
          echo "]" >> /tmp/matrix.json

          total=$(jq 'length' /tmp/matrix.json)
          if [ "$total" -eq 0 ]; then
            echo "::error::matrix is empty"
            exit 1
          fi

          missing=$(jq '[.[] | select((.model | type) != "string")] | length' /tmp/matrix.json)
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing config(s) under configs/<os>/ have no string 'model' field"
            exit 1
          fi

          # Every model must survive the device filter the workflow applies.
          while read -r model; do
            n=$(jq --arg m "$model" 'map(select(.model == $m or (.model | startswith($m + "-")))) | length' /tmp/matrix.json)
            if [ "$n" -eq 0 ]; then
              echo "::error::device filter for '$model' matches nothing"
              exit 1
            fi
          done < <(jq -r '.[].model' /tmp/matrix.json | sort -u)

          # Every op_model choice must resolve to at least one profile. A
          # selector that matches nothing produces an empty matrix, and the
          # dispatch fails only after the user has picked it.
          python3 - <<'PY'
          import json, sys, yaml

          wf = yaml.safe_load(open(".github/workflows/build-kernel-release.yml"))
          # PyYAML reads the bare `on:` key as boolean True.
          root = wf.get("on") or wf.get(True) or {}
          options = (
              root.get("workflow_dispatch", {})
                  .get("inputs", {})
                  .get("op_model", {})
                  .get("options", [])
          )
          profiles = json.load(open("/tmp/matrix.json"))

          def matches(sel):
              if sel == "All":
                  return len(profiles)
              return sum(
                  1 for p in profiles
                  if p.get("model") == sel or str(p.get("model", "")).startswith(sel + "-")
              )

          bad = [s for s in options if matches(s) == 0]
          for s in bad:
              print(f"::error::op_model choice '{s}' matches no profile")
          print(f"op_model choices: {len(options)}, all resolve" if not bad else "")
          sys.exit(1 if bad else 0)
          PY

          # Blocked profiles are dropped from the build matrix. Dropping them
          # must leave something to build: a matrix where every profile is
          # blocked would make every dispatch fail.
          buildable=$(jq '[.[] | select(.blocked? == null)] | length' /tmp/matrix.json)
          if [ "$buildable" -eq 0 ]; then
            echo "::error::every profile is blocked; nothing can be built"
            exit 1
          fi

          echo "matrix generation ok: $total profiles, $(jq '[.[] | select(.blocked? != null)] | length' /tmp/matrix.json) blocked, $buildable buildable"

      - name: Validate workflow and action YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          failed = False
          for path in sorted(glob.glob('.github/workflows/*.yml') +
                             glob.glob('.github/actions/*/action.yml') +
                             glob.glob('.github/actions/*/*/action.yml')):
              try:
                  yaml.safe_load(open(path))
              except Exception as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Install pinned shellcheck
        run: |
          # actionlint shells out to whatever shellcheck is on PATH, so leaving
          # this to the runner image makes the gate non-deterministic: the
          # preinstalled version reports codes (SC2236, SC2002) that 0.11.0 does
          # not, and the image changes without notice. Pin it.
          version=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -2

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # Structural problems (invalid action metadata, duplicate choice
          # options, bad expressions) are fatal. The shellcheck codes below are
          # a pre-existing backlog in the 3000-line build action - mostly
          # unquoted variables - suppressed so this gate reports new problems
          # instead of re-reporting the old ones. Burn the backlog down
          # separately, then drop the matching -ignore line.
          #
          # SC2236 and SC2002 are listed defensively: the pinned shellcheck does
          # not emit them, but older versions do, and an ignore that matches
          # nothing is harmless.
          ./actionlint -color -shellcheck=/usr/local/bin/shellcheck \
            -ignore 'SC2086:.*' \
            -ignore 'SC2034:.*' \
            -ignore 'SC2129:.*' \
            -ignore 'SC2016:.*' \
            -ignore 'SC2001:.*' \
            -ignore 'SC2059:.*' \
            -ignore 'SC2193:.*' \
            -ignore 'SC2181:.*' \
            -ignore 'SC2163:.*' \
            -ignore 'SC2236:.*' \
            -ignore 'SC2002:.*'

      - name: shellcheck scripts
        run: shellcheck -s bash scripts/*.sh

      - name: python syntax
        run: python3 -m py_compile scripts/*.py

      - name: composite action expression budget
        run: |
          # A run block containing an expression is compiled as a single
          # expression, and GitHub rejects anything over 21,000 characters with
          # "The template is not valid ... Exceeded max expression length
          # 21000". That failure happens before the step runs, so it looks like
          # a build failure with no useful log. Check it here instead.
          python3 - <<'PY'
          import pathlib, sys

          LIMIT = 21000
          OPEN = '$' + '{{'
          failed = False

          for path in sorted(pathlib.Path('.github/actions').rglob('action.yml')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if line.strip() not in ('run: |', 'run: >'):
                      continue
                  indent = len(line) - len(line.lstrip())
                  end = i + 1
                  while end < len(lines):
                      nxt = lines[end]
                      if nxt.strip() and (len(nxt) - len(nxt.lstrip())) <= indent:
                          break
                      end += 1
                  raw = lines[i + 1:end]
                  if not any(OPEN in x for x in raw):
                      continue
                  content_indent = min(
                      (len(x) - len(x.lstrip())) for x in raw if x.strip()
                  )
                  body = '\n'.join(
                      x[content_indent:] if x.strip() else '' for x in raw
                  )
                  if len(body) > LIMIT:
                      print(
                          f'{path}:{i + 1}: run block is {len(body)} chars, '
                          f'over the {LIMIT} expression limit. Move part of it '
                          f'into a script.'
                      )
                      failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: build-info & KMI checker smoke test
        run: |
          set -euo pipefail
          shopt -s nullglob
          printf 'payload' > /tmp/fake.zip
          count=0
          for manifest in manifests/*.xml manifests/*/*.xml; do
            python3 scripts/build-info.py \
              --out /tmp/build-info.json \
              --manifest "$manifest" \
              --model OP15-COS17 --os-version A16 \
              --android-version android16 --kernel-version 6.12 \
              --kernel-full-version android16-6.12.69 \
              --optimization O2 --lto none \
              --kasan true --bbg false --bbr3 true \
              --autofdo true --mlgo true --bore true --adios true --damon true \
              --feature-tag true/true/true/KASAN:true/O2/LTO:none/AFDO:true/MLGO:true/BBR3:true/BBG:false \
              --release-tag v2.3.0-r1 \
              --zip /tmp/fake.zip > /dev/null
            python3 - <<'PY'
          import json
          data = json.load(open("/tmp/build-info.json"))
          assert data["schema"] == 2, f"unexpected schema {data.get('schema')}"
          k = data["kernel"]
          assert k["source_url"] and k["source_ref"], "kernel source did not resolve"
          f = data["features"]
          for key in ("kasan_hw_tags", "bbg", "bbr3", "bore", "adios", "damon", "autofdo", "mlgo", "lto", "optimization", "feature_tag"):
              assert key in f, f"missing feature key: {key}"
          assert data["artifact"]["release_tag"] == "v2.3.0-r1"
          PY
            count=$((count + 1))
          done
          echo "build-info v2 resolved kernel source and feature flags for $count manifest(s)"
          python3 scripts/kmi-check.py --help > /dev/null

      - name: Patch hygiene & OP15-COS17 policy gate
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          failed = False
          patch_files = sorted(pathlib.Path(".github/actions/build-kernel/patches").rglob("*.patch"))
          if not patch_files:
              print("::error::No .patch files found under .github/actions/build-kernel/patches")
              sys.exit(1)

          for p in patch_files:
              text = p.read_text(encoding="utf-8", errors="replace")
              if not text.strip():
                  print(f"::error::{p}: patch file is empty")
                  failed = True
              if ("diff --git " not in text) and ("--- " not in text or "+++ " not in text):
                  print(f"::error::{p}: missing unified diff header")
                  failed = True

          cfg = json.load(open("configs/a16/OP15-COS17.json", encoding="utf-8"))
          if cfg.get("kasan") is not True:
              print("::error::OP15-COS17.json must keep kasan=true to export kasan_flag_enabled for stock ColorOS 17 vendor modules")
              failed = True
          if cfg.get("bbg") is not False:
              print("::error::OP15-COS17.json must keep bbg=false for EFISP chainloader compatibility")
              failed = True
          susfs_hash = cfg.get("susfs_hash", "")
          if not re.fullmatch(r"[0-9a-f]{40}", susfs_hash):
              print(f"::error::OP15-COS17.json susfs_hash '{susfs_hash}' is not a pinned 40-char SHA")
              failed = True
          manifest = pathlib.Path("manifests") / cfg["os_version"].lower() / cfg["manifest"]
          if not manifest.is_file():
              print(f"::error::OP15-COS17 manifest not found at {manifest}")
              failed = True

          print(f"Verified {len(patch_files)} patch files and OP15-COS17 policy invariants")
          sys.exit(1 if failed else 0)
          PY

  patch-check:
    name: Patch dry-run (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Apply patch sequence to the pinned base
        run: |
          set +e
          ./scripts/check-patches.sh "${{ matrix.config }}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          # Blocking entries are refs we control (a pinned susfs_hash, or a KMI
          # key whose workflow default is a pinned SHA) - a failure there is a
          # regression in this repo. The rest track a moving upstream branch
          # tip, so a failure is drift we cannot fix here: surface it as a
          # warning annotation instead of failing the PR.
          if [ "${{ matrix.blocking }}" = "true" ]; then
            exit "$rc"
          fi
          echo "::warning title=Upstream SUSFS drift::${{ matrix.label }} no longer applies against the current default SUSFS ref. This profile tracks a moving branch tip, so it is upstream drift rather than a regression in this repo."

  select:
    name: Select patch-check targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Pick profiles that exercise repo-local patches
        id: pick
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json

          # Mirrors the androidXX_susfs_branch_or_commit input defaults in
          # build-kernel-release.yml.
          PINNED_DEFAULT_KEYS = {"android16-6.12"}

          entries = []
          for path in sorted(glob.glob("configs/*/*.json")):
              if path.endswith("schema.json"):
                  continue
              cfg = json.load(open(path))
              # A blocked profile cannot be built, so a dry-run of its patch
              # sequence only reports the blocker we already know about.
              if cfg.get("blocked"):
                  continue
              # Profiles whose build applies a patch we maintain in this repo.
              if cfg.get("bore") or cfg.get("adios") or cfg.get("autofdo") or cfg.get("susfs_hash"):
                  entries.append({"label": cfg["model"], "config": path, "blocking": True})

          # One canary per kernel source that relies on the default SUSFS ref,
          # so a moved default branch is caught before it reaches a build.
          seen = set()
          for path in sorted(glob.glob("configs/*/*.json")):
              if path.endswith("schema.json"):
                  continue
              cfg = json.load(open(path))
              if cfg.get("blocked"):
                  continue
              if not cfg.get("susfs") or cfg.get("susfs_hash"):
                  continue
              key = f"{cfg['android_version']}-{cfg['kernel_version']}"
              if key in seen:
                  continue
              seen.add(key)
              entries.append({
                  "label": f"{cfg['model']}-default",
                  "config": path,
                  "blocking": key in PINNED_DEFAULT_KEYS,
              })

          print("matrix=" + json.dumps({"include": entries}))
          PY

  checkpatch:
    name: checkpatch (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Fetch checkpatch.pl from the pinned GKI base
        run: |
          set -euo pipefail
          commit=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for project in ET.parse("manifests/a16/oneplus_15_6.12.69_gki_w.xml").getroot().findall("project"):
              if project.get("name") == "kernel/common":
                  print(project.get("revision"))
                  break
          PY
          )
          git init -q kc
          git -C kc remote add origin https://android.googlesource.com/kernel/common
          git -C kc fetch -q --depth 1 --filter=blob:none origin "$commit"
          git -C kc checkout -q FETCH_HEAD -- scripts/checkpatch.pl scripts/spelling.txt

      - name: Run checkpatch on hand-ported patches
        run: |
          set -uo pipefail
          for patch in .github/actions/build-kernel/patches/*.patch; do
            echo "### $(basename "$patch")"
            perl kc/scripts/checkpatch.pl --no-tree --strict --terse \
              --ignore FILE_PATH_CHANGES,SPDX_LICENSE_TAG < "$patch" || true
            echo
          done
          # Advisory only: the hand-ported patches are out-of-tree by design and
          # will never be style-clean. Surface the findings, do not gate on them.
          exit 0
