name: Cache Warmer

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual warming

jobs:
  generate-matrix:
    name: Generate Warmup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      susfs_hash_android16_6_12: ${{ steps.set-matrix.outputs.susfs_hash_android16_6_12 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: Generate Matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          echo "susfs_hash_android16_6_12=acb92d4abc922cac384a207744b2db40281a7c7f" >> "$GITHUB_OUTPUT"

          echo "[" > matrix.json
          mapfile -t all_json_files < <(find configs/ -mindepth 2 -name "*.json" -print0 | xargs -0 -n1)
          for i in "${!all_json_files[@]}"; do
            file="${all_json_files[$i]}"
            if [ -f "$file" ]; then
              jq -c '.' "$file" >> matrix.json
              if [ $((i+1)) -lt ${#all_json_files[@]} ]; then
                echo "," >> matrix.json
              fi
            fi
          done
          echo "]" >> matrix.json

          MATRIX=$(jq -c '{include: .}' < matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-latest
    steps:
      - name: Download custom ccache once
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://github.com/cctv18/ccache-ECS/releases/download/ccache-ECS-v1.0/linux-x86_64-glibc-binary.zip"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS --connect-timeout 30 --max-time 120 "$url" -o /tmp/ccache.zip && unzip -o /tmp/ccache.zip -d /tmp; then
              ok=1; break
            fi
            echo "attempt $attempt failed (504/throttle); backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            mv /tmp/ccache ./ccache
            echo " downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ./ccache
          fi
          echo "::endgroup::"
      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  prepare-susfs:
    name: Prepare SUSFS source (fetch once)
    runs-on: ubuntu-latest
    needs: generate-matrix
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: Fetch all SUSFS refs once
        run: |
          set -uo pipefail
          echo "::group::Fetch susfs4ksu refs once"
          refs="${{ needs.generate-matrix.outputs.susfs_hash_android16_6_12 }} gki-android16-6.12"
          mapfile -t all_json_files < <(find configs/ -mindepth 2 -name "*.json" -print0 | xargs -0 -n1)
          for f in "${all_json_files[@]}"; do
            h=$(jq -r '.susfs_hash // empty' "$f" 2>/dev/null || true)
            [ -n "$h" ] && refs="$refs $h"
          done
          refs=$(echo "$refs" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')
          git init -q susfs4ksu
          cd susfs4ksu
          git config advice.detachedHead false
          git remote add origin "https://gitlab.com/simonpunk/susfs4ksu.git"
          ok=0
          for ref in $refs; do
            echo " fetching $ref"
            if git fetch -q --depth 1 origin "$ref" 2>/dev/null || git fetch -q --depth 50 origin "$ref" 2>/dev/null; then
              ok=$((ok+1))
            else
              echo "  failed: $ref"
            fi
          done
          echo " fetched $ok refs into one shared checkout"
          [ "$ok" -gt 0 ]
          echo "::endgroup::"

      - name: Upload SUSFS source artifact
        uses: actions/upload-artifact@v7
        with:
          name: susfs4ksu-src
          path: susfs4ksu
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  warm-cache:
    name: ${{ matrix.model }} (${{ matrix.os_version }})
    needs: [generate-matrix, prepare_ccache, prepare-susfs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve SUSFS Hash
        id: susfs_res
        run: |
          HASH="${{ matrix.susfs_hash }}"
          if [ -z "$HASH" ]; then
            HASH="${{ needs.generate-matrix.outputs.susfs_hash_android16_6_12 }}"
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Install Minimal Dependencies
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev lz4 \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
          sudo apt-get clean
          echo " Dependencies installed"
          echo "::endgroup::"

      - name: Get prebuilt ccache (downloaded once by prepare_ccache)
        uses: actions/download-artifact@v4
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true

      - name: Install ccache (ECS by cctv18, shared via artifact)
        run: |
          set -uo pipefail
          echo "::group::Install ccache"
          if [ -s ccache-dl/ccache ]; then
            sudo cp -f ccache-dl/ccache /usr/bin/ccache
            sudo chmod +x /usr/bin/ccache
            echo " installed custom ccache from shared artifact"
          else
            echo "::warning::shared ccache artifact unavailable; using apt ccache"
          fi
          rm -rf ccache-dl
          echo "[DEBUG] Ccache version : $(ccache --version | head -1)"
          echo "::endgroup::"

      - name: Configure ccache & LTO cache (bounded)
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            LDCACHE_DIR="${{ github.workspace }}/.ld_cache"
            mkdir -p "$CACHE_DIR" "$LDCACHE_DIR"

            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "LDCACHE_DIR=$LDCACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_INODE_CACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
            )

            for setting in "${SETTINGS[@]}"; do
              export "$setting"
              echo "$setting" >> "$GITHUB_ENV"
            done

            if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
            fi

            echo " ccache configured successfully"
            ccache -p
          else
            echo "ccache not found, skipping configuration."
          fi
          echo "::endgroup::"

      - name: Get prebuilt SUSFS source (shared, avoids per-job GitLab fetches)
        uses: actions/download-artifact@v4
        with:
          name: susfs4ksu-src
          path: .
        continue-on-error: true

      - name: Warm Build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ toJson(matrix) }}
          ksu_type: "KSUN"
          ksu_branch_or_hash: "builtin"
          susfs_commit_hash_or_branch: ${{ steps.susfs_res.outputs.hash }}
          optimize_level: "O2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
